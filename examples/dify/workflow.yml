app:
  name: Pushary customer approval demo
  description: Native Human Input; returns a result only. The protected order effect
    lives in the Pushary backend example.
  icon: 📱
  icon_background: '#E4FBCC'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      data:
        desc: ''
        type: start
        title: Order review input
        variables:
        - variable: question
          label: Complete order question
          type: paragraph
          required: true
          max_length: 500
          options: []
      position:
        x: 30
        y: 200
      positionAbsolute:
        x: 30
        y: 200
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 100
    - id: review
      type: custom
      data:
        desc: ''
        type: human-input
        title: Customer approval
        form_content: '{{#start.question#}}'
        inputs: []
        delivery_methods:
        - id: 0fc09604-46bb-46ac-8663-104c675c7967
          type: webapp
          enabled: true
        user_actions:
        - id: approve
          title: Approve
          button_style: primary
        - id: reject
          title: Reject
          button_style: default
        timeout: 1
        timeout_unit: hour
      position:
        x: 340
        y: 200
      positionAbsolute:
        x: 340
        y: 200
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 100
    - id: approved
      type: custom
      data:
        desc: ''
        type: end
        title: Approved result only
        outputs:
        - variable: action
          value_type: string
          value_selector:
          - review
          - __action_id
        - variable: question
          value_type: string
          value_selector:
          - review
          - __rendered_content
      position:
        x: 660
        y: 100
      positionAbsolute:
        x: 660
        y: 100
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 100
    - id: stopped
      type: custom
      data:
        desc: ''
        type: end
        title: No business action
        outputs:
        - variable: stopped_question
          value_type: string
          value_selector:
          - start
          - question
      position:
        x: 660
        y: 360
      positionAbsolute:
        x: 660
        y: 360
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 100
    edges:
    - id: start-source-review
      source: start
      sourceHandle: source
      target: review
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: start
        targetType: human-input
        isInIteration: false
        isInLoop: false
    - id: review-approve-approved
      source: review
      sourceHandle: approve
      target: approved
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: human-input
        targetType: end
        isInIteration: false
        isInLoop: false
    - id: review-reject-stopped
      source: review
      sourceHandle: reject
      target: stopped
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: human-input
        targetType: end
        isInIteration: false
        isInLoop: false
    - id: review-__timeout-stopped
      source: review
      sourceHandle: __timeout
      target: stopped
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: human-input
        targetType: end
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 0.8
